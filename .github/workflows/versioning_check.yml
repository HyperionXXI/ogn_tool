name: Versioning Policy Check

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'docs/VERSIONING.md'
      - '.github/workflows/versioning_check.yml'

jobs:
  semver-tag-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Check tag format
        if: github.ref_type == 'tag'
        run: |
          TAG_NAME=$(echo $GITHUB_REF | sed 's|refs/tags/||')
          if [[ ! $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG_NAME does not follow SemVer (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
      - name: Check VERSIONING.md exists
        run: |
          if [ ! -f docs/VERSIONING.md ]; then
            echo "VERSIONING.md missing"
            exit 1
          fi
      - name: Validate VERSIONING.md content
        run: |
          grep -q 'Semantic Versioning' docs/VERSIONING.md || (echo "VERSIONING.md does not mention SemVer" && exit 1)

  versioning-doc-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Validate VERSIONING.md content
        run: |
          grep -q 'Semantic Versioning' docs/VERSIONING.md || (echo "VERSIONING.md does not mention SemVer" && exit 1)
